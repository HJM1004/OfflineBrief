name: 機内ブリーフ公開

# GAS+Drive方式への移行後、public/ はビルド生成物ではなく手書きの閲覧アプリ本体
# (GAS Web AppからJSONを取得して描画する薄いPWAシェル)になった。
# そのためこのワークフローはもう build_site.py を実行せず、public/ をそのまま
# GitHub Pagesにアップロードするだけでよい。public/ が変わったとき(閲覧アプリの
# コード修正時)だけ実行される。日々のニュースデータ自体はGAS Web App経由で
# Google Driveに保存され、閲覧アプリが実行時にfetchするため、この公開フローとは
# 無関係に毎日自動更新される。

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
